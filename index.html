
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Key - Nhận Key</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: radial-gradient(circle at top, #243b75, #080d1b 65%);
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(20, 30, 55, .94);
      border: 1px solid #34466e;
      border-radius: 22px;
      box-shadow: 0 20px 60px #0008;
    }
    .logo {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: #315efb;
      font-size: 30px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { color: #b7c4df; line-height: 1.6; }
    .status {
      margin: 24px 0;
      padding: 14px;
      border-radius: 12px;
      background: #101a31;
      color: #a8bbdf;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: #315efb;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #4770ff; }
    button:disabled { opacity: .6; cursor: wait; }
    footer { margin-top: 22px; color: #8494b5; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🔑</div>
    <h1>AUTO KEY</h1>
    <p>Hệ thống nhận key tự động</p>

    <div class="status" id="status">
      Hệ thống đã sẵn sàng
    </div>

    <button id="receive">NHẬN KEY</button>

    <footer>Auto Key System · Website miễn phí</footer>
  </main>

  <script>
    
document.getElementById("receive").addEventListener("click", function () {
  window.location.href = "https://gtraffic.io/8Qt59ER";
});
  </script>
</body>
</html>
