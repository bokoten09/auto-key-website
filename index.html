<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Key - Test Mode</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: Arial, sans-serif; color: white;
      background: radial-gradient(circle at top, #243b75, #080d1b 65%);
    }
    .card {
      width: 100%; max-width: 440px; padding: 32px 24px; text-align: center;
      background: rgba(20, 30, 55, .94); border: 1px solid #34466e;
      border-radius: 22px; box-shadow: 0 20px 60px #0008;
    }
    .logo {
      width: 66px; height: 66px; display: grid; place-items: center;
      margin: 0 auto 18px; border-radius: 18px; background: #e67e22; font-size: 30px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { color: #f39c12; line-height: 1.6; font-weight: bold; }
    .status {
      margin: 24px 0; padding: 14px; border-radius: 12px;
      background: #101a31; color: #a8bbdf; font-size: 14px; word-break: break-all;
    }
    button {
      width: 100%; padding: 15px; border: 0; border-radius: 12px;
      color: white; background: #27ae60; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #2ecc71; }
    .key-box {
      margin-top: 15px; padding: 12px; background: #0d1527;
      border: 1px dashed #34466e; border-radius: 8px; font-family: monospace;
      font-size: 18px; color: #00ffcc; word-break: break-all;
    }
    footer { margin-top: 22px; color: #8494b5; font-size: 12px; }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">🛠️</div>
    <h1>CHẾ ĐỘ TEST</h1>
    <p>Đang tắt vượt link để kiểm tra lấy key</p>

    <div class="status" id="status">Bấm nút bên dưới để nhận key ngay lập tức.</div>

    <button id="actionBtn" type="button">NHẬN KEY (TEST NHANH)</button>

    <footer>Test Mode · Auto Key System</footer>
  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8vkndIDPQZXQTEUqHENL7vnR_YCJA0th_7FCta6s-kcDjUvbKn9EyQwPLLqwlwrqu/exec";
    const SECRET_TOKEN = "my_secret_token_123";

    const statusEl = document.getElementById("status");
    const actionBtn = document.getElementById("actionBtn");

    // Kiểm tra nếu đã có key lưu trong trình duyệt
    const savedKey = sessionStorage.getItem("my_claimed_key");
    if (savedKey) {
      statusEl.innerHTML = `Key hiện tại của bạn:<br><div class="key-box">${savedKey}</div>`;
      actionBtn.innerText = "XÓA KEY TEST & LẤY MỚI";
      actionBtn.style.background = "#c0392b";
      actionBtn.onclick = function() {
        sessionStorage.removeItem("my_claimed_key");
        window.location.reload();
      };
    } else {
      actionBtn.onclick = function () {
        statusEl.innerHTML = "⏳ Đang kết nối lấy key từ Google Sheets...";
        actionBtn.style.display = "none";

        // Gọi trực tiếp Apps Script không cần qua GTraffic
        fetch(`${APPS_SCRIPT_URL}?action=get_key&token=${SECRET_TOKEN}`)
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              sessionStorage.setItem("my_claimed_key", data.key);
              statusEl.innerHTML = `🎉 Lấy key thành công!<br><div class="key-box">${data.key}</div>`;
              actionBtn.innerText = "XÓA KEY TEST & LẤY MỚI";
              actionBtn.style.background = "#c0392b";
              actionBtn.style.display = "block";
              actionBtn.onclick = function() {
                sessionStorage.removeItem("my_claimed_key");
                window.location.reload();
              };
            } else {
              statusEl.innerHTML = `<span style="color: #ff6b6b;">${data.message}</span>`;
              actionBtn.style.display = "block";
            }
          })
          .catch(error => {
            statusEl.innerHTML = `<span style="color: #ff6b6b;">Lỗi kết nối máy chủ!</span>`;
            actionBtn.style.display = "block";
            console.error(error);
          });
      };
    }
  </script>
</body>
</html>
