<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Key - Test Mode</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: Arial, sans-serif; color: white;
      background: radial-gradient(circle at top, #243b75, #080d1b 65%);
    }
    .card {
      width: 100%; max-width: 440px; padding: 32px 24px; text-align: center;
      background: rgba(20, 30, 55, .94); border: 1px solid #34466e;
      border-radius: 22px; box-shadow: 0 20px 60px #0008;
    }
    .logo {
      width: 66px; height: 66px; display: grid; place-items: center;
      margin: 0 auto 18px; border-radius: 18px; background: #e67e22; font-size: 30px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { color: #f39c12; line-height: 1.6; font-weight: bold; }
    button {
      width: 100%; padding: 15px; border: 0; border-radius: 12px;
      color: white; background: #27ae60; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 20px; transition: background 0.2s;
    }
    button:hover { background: #2ecc71; }
    footer { margin-top: 22px; color: #8494b5; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🛠️</div>
    <h1>CHẾ ĐỘ TEST</h1>
    <p>Đang tắt vượt link để kiểm tra chuyển sang trang kết quả</p>

    <button id="testBtn" type="button">👉 BẤM ĐỂ NHẬN KEY (TEST NHANH)</button>

    <footer>Test Mode · Auto Key System</footer>
  </main>

  <script>
    const SECRET_TOKEN = "my_secret_token_123";

    document.getElementById("testBtn").onclick = function() {
      // Tự động chuyển thẳng sang trang result.html kèm token test mà không qua GTraffic
      const currentDirUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
      window.location.href = `${currentDirUrl}/result.html?token=${SECRET_TOKEN}`;
    };
  </script>
</body>
</html>
