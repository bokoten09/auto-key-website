<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Key - Vượt Link</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: Arial, sans-serif; color: white;
      background: radial-gradient(circle at top, #243b75, #080d1b 65%);
    }
    .card {
      width: 100%; max-width: 440px; padding: 32px 24px; text-align: center;
      background: rgba(20, 30, 55, .94); border: 1px solid #34466e;
      border-radius: 22px; box-shadow: 0 20px 60px #0008;
    }
    .logo {
      width: 66px; height: 66px; display: grid; place-items: center;
      margin: 0 auto 18px; border-radius: 18px; background: #315efb; font-size: 30px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { color: #b7c4df; line-height: 1.6; }
    button {
      width: 100%; padding: 15px; border: 0; border-radius: 12px;
      color: white; background: #315efb; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 20px; transition: background 0.2s;
    }
    button:hover { background: #4770ff; }
    footer { margin-top: 22px; color: #8494b5; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🔑</div>
    <h1>GET KEY SYSTEM</h1>
    <p>Bấm nút bên dưới để hoàn thành vượt link và nhận key sử dụng.</p>

    <button id="getBtn" type="button">🚀 VƯỢT LINK LẤY KEY</button>

    <footer>Auto Key System</footer>
  </main>

  <script>
    const SECRET_TOKEN = "my_secret_token_123";

    document.getElementById("getBtn").onclick = function() {
      // Tự động lấy URL hiện tại để chuyển hướng đến file result.html
      const currentDirUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
      const resultPageUrl = `${currentDirUrl}/result.html`;
      
      const gtrafficTarget = `${resultPageUrl}?token=${SECRET_TOKEN}`;
      
      // Chuyển hướng sang GTraffic
      window.location.href = `https://gtraffic.io/8Qt59ER?redirect=${encodeURIComponent(gtrafficTarget)}`;
    };
  </script>
</body>
</html>
